name: Update

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # UTC: 02:17, 08:17, 14:17, 20:17 (Beijing: 10:17, 16:17, 22:17, 04:17).
    # GitHub may delay scheduled jobs. Avoid the top of the hour.
    - cron: '17 2,8,14,20 * * *'

permissions:
  contents: read

concurrency:
  group: feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test feed parsing, recovery and rendering
        run: |
          python -m unittest discover -s tests -v
          node --check statics/index.js
      - name: Build feed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build.py 2>&1 | tee build.log
          test -s target/index.html
          test -s target/cache.json
          test -s target/status.json
      - name: Upload build log
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: feed-build-log
          path: build.log
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          force_orphan: true
