name: Feed diagnostics
on:
  push:
    branches: [fix/arxiv-request-recovery]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public arXiv responses from the scheduled runner
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time
          api = 'https://export.arxiv.org/api/query?search_query=cat%3Acs.RO&start=0&max_results=300&sortBy=lastUpdatedDate&sortOrder=descending'
          for name, url, accept in [('existing request', api, None), ('explicit Atom accept', api, 'application/atom+xml, application/xml;q=0.9, */*;q=0.1'), ('official daily feed', 'https://rss.arxiv.org/atom/cs.RO', 'application/atom+xml')]:
              headers = {'User-Agent': 'RobotPapers/2.0 (https://github.com/liujy25/robot-papers)'}
              if accept: headers['Accept'] = accept
              print(name, flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as r:
                      print(r.status, r.headers.get('Content-Type'), r.read(500).decode(errors='replace'))
              except urllib.error.HTTPError as e:
                  print(e.code, e.headers.get('Content-Type'), e.read(1200).decode(errors='replace'))
              except Exception as e:
                  print(type(e).__name__, str(e))
              time.sleep(3.2)
          PY
